<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Finance Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header>

            <h1> Personal Finance Dashboard</h1>

            <p>
                Track your income and expenses
            </p>

            <button id="theme-toggle">
            🌙 Dark Mode
        </button>

        </header>

        <section class="summary">

            <div class="card">

                <h3>Total Balance</h3>

                <h2 id="balance">
                    Rs. 0
                </h2>

            </div>

            <div class="card">

                <h3>Income</h3>

                <h2 id="income">
                    Rs. 0
                </h2>

            </div>

            <div class="card">

                <h3>Expenses</h3>

                <h2 id="expense">
                    Rs. 0
                </h2>

            </div>

        </section>

        <section class="card add-transaction">

            <h2>Add Transaction</h2>

            <form id="transaction-form">

                <input id="title" type="text" placeholder="Transaction title" required>

                <input id="amount" type="number" placeholder="Amount (Rs.)" required>

                <select id="category">

                <option>Food</option>
                <option>Transport</option>
                <option>Shopping</option>
                <option>Rent</option>
                <option>Education</option>
                <option>Bills</option>
                <option>Health</option>
                <option>Entertainment</option>
                <option>Salary</option>
                <option>Other</option>

            </select>

                <select id="type">

                <option value="income">
                    Income
                </option>

                <option value="expense">
                    Expense
                </option>

            </select>

                <select id="sort">

                <option value="newest">Newest</option>
                
                <option value="highest">Highest Amount</option>
                
                <option value="lowest">Lowest Amount</option>
                
                <option value="az">A-Z</option>
                
                </select>

                <button type="submit">

                Add Transaction

            </button>

            </form>

        </section>

        <section class="card transactions">

            <h2>Recent Transactions</h2>

            <input id="search-input" placeholder="Search transactions...">

            <div id="transaction-list">

            </div>

        </section>
        <section class="card">

            <h2>Spending by Category</h2>

            <div id="category-summary"></div>

        </section>

        <section class="card">

            <h2>Monthly Spending</h2>

            <canvas id="expenseChart"></canvas>

        </section>
        <button id="export-btn">

            Export CSV
        
        </button>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="js/dom.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/transactions.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
